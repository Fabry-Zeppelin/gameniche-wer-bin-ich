<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Wer bin ich?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: eine Spalte wie eine Handy-App. Start = Einstellungen als Panels, Spiel = hohe Karte mit zwei grossen Tipp-Flächen.
   Die Karte nimmt die Seltenheitsfarbe der Kategorie an (Fortnite-Rarity-Palette). */
:root {
  --bg: #14122b;
  --surface: #1f1c3f;
  --surface-2: #2b2757;
  --line: #39346b;
  --fg: #f4f2ff;
  --muted: #aaa5d8;
  --accent: #ffd23f;
  --accent-fg: #261c00;
  --good: #43e0a0;
  --bad: #ff6178;
  --r-common: #b5bccb;
  --r-uncommon: #62d33f;
  --r-rare: #42a9ff;
  --r-epic: #b86dff;
  --r-legendary: #ff9a2e;
  --r-gold: #ffd23f;
  --r-pink: #ff6fb1;
  --f-display: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
  --f-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.5 var(--f-body);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button[disabled] { cursor: not-allowed; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0; }
.brand { display: flex; flex-direction: column; gap: 6px; }
.brand h1 { font: 800 clamp(2.6rem, 12vw, 3.8rem)/.95 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }

.panel { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.panel h2 { font: 700 .78rem var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.link { color: var(--accent); font-weight: 700; font-size: .9rem; padding: 6px 4px; }
.hint { margin: 0; color: var(--muted); font-size: .92rem; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 42px; border-radius: 999px; background: var(--surface-2); border: 2px solid transparent; font-weight: 500; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.chip small { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); }
.chip[aria-pressed="false"] { opacity: .55; }
.chip[disabled] { opacity: .45; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { padding: 12px 8px; border-radius: 9px; font-weight: 700; min-height: 46px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.btn-primary { background: var(--accent); color: var(--accent-fg); font: 800 1.15rem var(--f-display); padding: 16px; border-radius: 14px; width: 100%; min-height: 56px; }
.btn-primary[disabled] { opacity: .4; }
.btn-ghost { background: var(--surface-2); padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; min-height: 52px; }
.foot { color: var(--muted); font-size: .82rem; margin: 0; text-wrap: pretty; }
.best { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; margin: 0; }
.best b { color: var(--fg); font-variant-numeric: tabular-nums; }

.play { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.time { font: 800 2.2rem/1 var(--f-display); }
.time.low { color: var(--bad); }
.card {
  flex: 1; min-height: 280px; border-radius: 24px; padding: 24px 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center;
  background: radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--c) 48%, var(--surface)), var(--surface) 78%);
}
.cat { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--fg); background: color-mix(in srgb, var(--c) 40%, var(--bg)); padding: 6px 12px; border-radius: 999px; }
.term { font: 800 clamp(2rem, 9vw, 3.6rem)/1.05 var(--f-display); hyphens: auto; overflow-wrap: anywhere; text-wrap: balance; max-width: 100%; }
.card.pop-ok { animation: popok .35s ease-out; }
.card.pop-skip { animation: popskip .35s ease-out; }
@keyframes popok { from { box-shadow: 0 0 0 0 var(--good); } to { box-shadow: 0 0 0 18px transparent; } }
@keyframes popskip { from { box-shadow: 0 0 0 0 var(--muted); } to { box-shadow: 0 0 0 18px transparent; } }

.pad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pad.one { grid-template-columns: 1fr; }
.pad button { padding: 22px 8px; border-radius: 16px; font: 800 1.15rem var(--f-display); min-height: 72px; }
.pad .skip { background: var(--surface-2); }
.pad .ok { background: var(--good); color: #04281a; }
.pad button[disabled] { opacity: .4; }

.count { align-items: center; justify-content: center; text-align: center; gap: 24px; }
.bignum { font: 800 clamp(7rem, 40vw, 12rem)/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }

.hints { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.hints li { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: baseline; text-wrap: pretty; }
.hints li b { color: var(--c); font: 800 1.1rem var(--f-display); min-width: 1ch; }
.hints li.locked { opacity: .4; }
.qtitle { font: 800 1.6rem/1.1 var(--f-display); margin: 0; }
.field { display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; font: 500 16px var(--f-body); color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 14px; }
.field input[disabled] { opacity: .5; }
.field .btn-primary { width: auto; padding-inline: 20px; font-size: 1rem; }
.field.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.msg { margin: 0; min-height: 1.5em; font-weight: 500; }
.msg.good { color: var(--good); }
.msg.bad { color: var(--bad); }

.score-big { font: 800 clamp(4rem, 22vw, 6.5rem)/1 var(--f-display); color: var(--accent); margin: 0; font-variant-numeric: tabular-nums; }
.score-of { color: var(--muted); font: 700 1.2rem var(--f-body); }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rows li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); align-items: center; }
.rows .nm { min-width: 0; overflow-wrap: anywhere; }
.tag { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; flex: none; font-variant-numeric: tabular-nums; }
.tag.ok { background: color-mix(in srgb, var(--good) 25%, var(--bg)); color: var(--good); }
.tag.no { background: var(--bg); color: var(--muted); }
.newbest { color: var(--accent); font-weight: 700; margin: 0; }

.seg.stack { grid-template-columns: 1fr; }
.counter { display: grid; grid-template-columns: 72px 1fr; gap: 12px; }
.counter button { padding: 16px 8px; border-radius: 16px; font: 800 1.1rem var(--f-display); min-height: 64px; background: var(--surface-2); }
.counter .plus { background: var(--accent); color: var(--accent-fg); }
.nm small { color: var(--muted); margin-left: 4px; }
.card .hints { width: 100%; text-align: left; }
.card .score-big { font-size: clamp(3.5rem, 18vw, 5.5rem); }
.card .hint { text-wrap: balance; }

.pad .no { background: color-mix(in srgb, var(--bad) 35%, var(--surface-2)); }
.pad button small { display: block; font: 500 .8rem var(--f-body); opacity: .85; margin-top: 2px; }

.stackf { display: flex; flex-direction: column; gap: 8px; }
.stackf input { font: 500 16px var(--f-body); color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; width: 100%; }
.tag.rm { min-height: 36px; padding: 6px 12px; cursor: pointer; }
.tag.rm:hover { color: var(--bad); }

.card.tap { cursor: pointer; }
.card.veiled .term { letter-spacing: .25em; opacity: .75; }

.rows li { flex-wrap: wrap; }
.rowbtns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tag.pick { background: var(--accent); color: var(--accent-fg); }

@media (prefers-reduced-motion: reduce) {
  .card.pop-ok, .card.pop-skip, .field.shake { animation: none; }
}

/* Startauswahl */
.mode-card { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px 16px; min-height: 96px; }
.mode-card b { font: 800 1.35rem/1.1 var(--f-display); }
.mode-card span { color: var(--muted); font-size: .92rem; }
.mode-card:hover { border-color: var(--accent); }
.mode-card.on b { color: var(--accent); }

/* Online: Plätze am Tisch, Frage-Blasen, Raumcode */
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.seat { position: relative; background: var(--surface); border-radius: 16px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; border: 2px solid transparent; }
.seat .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 800 1.25rem var(--f-display); background: var(--sc, var(--r-rare)); color: #14122b; }
.seat .sn { font-weight: 700; font-size: .92rem; overflow-wrap: anywhere; line-height: 1.15; }
.seat .ss { font-size: .76rem; color: var(--muted); line-height: 1.2; }
.seat.me .sn::after { content: ' (du)'; color: var(--muted); font-weight: 500; }
.seat.off { opacity: .45; }
.seat.fin { background: var(--surface-2); }
.seat.turn { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); animation: pulse 1.6s ease-in-out infinite; }
.seat.turn .ss { color: var(--accent); font-weight: 700; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 6%, transparent); } }
.bubble { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow-wrap: anywhere; text-wrap: pretty; }
.bubble.ask { border-left: 4px solid var(--accent); }
.bubble .who { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.bubble .big { font: 700 1.2rem/1.25 var(--f-display); }
.bubble.good { border-left: 4px solid var(--good); }
.bubble.bad { border-left: 4px solid var(--bad); }
.code { font: 800 clamp(2.4rem, 14vw, 3.6rem)/1 var(--f-display); letter-spacing: .12em; color: var(--accent); margin: 0; user-select: all; }
.linkbox { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; user-select: all; margin: 0; }
.banner { background: color-mix(in srgb, var(--bad) 22%, var(--surface)); border-radius: 12px; padding: 10px 14px; font-weight: 500; margin: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.topbar b { font: 800 1.1rem var(--f-display); letter-spacing: .1em; }
.pad .ja { background: var(--good); color: #04281a; }
.pad .nein { background: color-mix(in srgb, var(--bad) 40%, var(--surface-2)); }
.pad button[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: 2px; }
.rowbtns.wrap { justify-content: flex-start; }
.stackf textarea { font: 500 16px var(--f-body); color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 14px; width: 100%; }
@media (prefers-reduced-motion: reduce) { .seat.turn { animation: none; } }
</style>

      '<section class="panel"><h2>Wie wollt ihr spielen?</h2>' +

  /* ---------- Startseite (am Tisch) ---------- */
  function renderHome() {
    S.where = 'local'; lastHtml = '';
    unlock();
    var n = pool().length;
    var G = GAMES[S.game];
    var gameChips = GAME_IDS.map(function (id) {
      var g = GAMES[id];
      var total = TERMS.filter(function (t) { return t.game === id; }).length;
      return '<button class="chip" style="--c:' + g.c + '" aria-pressed="' + (S.game === id) + '" data-act="game" data-v="' + id + '">' + esc(g.name) + ' <small>' + total + '</small></button>';
    }).join('');

    }).join('');

    }).join('');
    var pickedKeys = {}, pickedCount = 0;

      var t = validPick(nm);
      if (t && !pickedKeys[t.key]) { pickedKeys[t.key] = true; pickedCount++; }
    });
    var restN = pool().filter(function (t) { return !pickedKeys[t.key]; }).length;
    var needN = S.players.length - pickedCount;
    var canStart = S.players.length >= 2 && restN >= needN;
    var note = S.players.length < 2
      ? 'Füge mindestens 2 Mitspieler hinzu.'
      : (!canStart ? 'Zu wenige Begriffe für so viele Mitspieler. Wähle mehr Kategorien.' : S.players.length + ' Mitspieler, ' + n + ' Begriffe zur Auswahl.');
    $app.innerHTML =
      '<header class="brand"><div class="topbar"><p class="eyebrow">Am Tisch</p><button class="link" data-act="entry">Spielart wechseln</button></div><h1>Wer bin ich?</h1></header>' +
      '<section class="panel"><h2>Spiel</h2><div class="chips">' + gameChips + '</div></section>' +
      '<section class="panel"><div class="panel-head"><h2>Kategorien</h2><button class="link" data-act="allcats">Alle wählen</button></div><div class="chips">' + chips + '</div><button class="link" style="align-self:flex-start" data-act="edit">Begriffe bearbeiten</button></section>' +
      '<section class="panel"><h2>Regeln</h2><p class="hint">Jeder bekommt einen Begriff. Wer dran ist, schaut weg, die anderen decken den Begriff auf. Du darfst Fragen stellen, solange die Antwort Ja ist. Bei Nein ist der Nächste dran. Wer zuerst errät, bekommt die meisten Punkte. Begriffe kannst du selbst zuteilen, sonst entscheidet der Zufall.</p></section>' +
      '<section class="panel"><h2>Kategorie als Tipp</h2><div class="seg">' +
        '<button aria-pressed="' + S.showCat + '" data-act="cattip" data-v="1">Anzeigen</button>' +
        '<button aria-pressed="' + !S.showCat + '" data-act="cattip" data-v="0">Ausblenden</button></div>' +
        '<p class="hint">' + (S.showCat
          ? 'Wer rät, sieht vorher, ob er eine Waffe, ein Ort oder etwas anderes ist.'
          : 'Wer rät, bekommt keinen Hinweis auf die Kategorie. Das macht die Runde schwerer.') + '</p></section>' +
      '<section class="panel"><h2>Mitspieler (' + S.players.length + ')</h2>' +
        '<form id="pform"><div class="field"><label class="sr" for="pname">Name</label>' +
        '<input id="pname" type="text" maxlength="16" autocomplete="off" placeholder="Name eingeben">' +
        '<button class="btn-primary" type="submit">Hinzufügen</button></div></form>' +
        (pl ? '<ul class="rows">' + pl + '</ul>' : '<p class="hint">Noch niemand dabei. Füge alle hinzu, die mitspielen (2 bis 12).</p>') + '</section>' +
      '<button class="btn-primary" data-act="start"' + (canStart ? '' : ' disabled') + '>Spiel starten</button>' +
      '<p class="foot">' + note + ' Inoffizielles Fan-Projekt, nicht mit ' + esc(G.maker) + ' verbunden. Es werden keine offiziellen Bilder verwendet.</p>';
  }


  /* ---------- Begriffe bearbeiten ---------- */
  var ED = { custom: [], removed: [] };
  function loadEdits() {
    try {
      var o = JSON.parse(localStorage.getItem('wbi-edits') || '{}');
      return {
        custom: Array.isArray(o.custom) ? o.custom.filter(function (c) {
          return c && typeof c.name === 'string' && GAMES[c.game] && CATMAP[c.cat];
        }).slice(0, 300) : [],
        removed: Array.isArray(o.removed) ? o.removed.filter(function (k) { return typeof k === 'string'; }) : []
      };
    } catch (e) { return { custom: [], removed: [] }; }
  }
  function saveEdits() { try { localStorage.setItem('wbi-edits', JSON.stringify(ED)); } catch (e) { /* ohne Speicher weiter */ } }
  function customTerm(c) {
    var cat = CATMAP[c.cat];
    if (!cat || !GAMES[c.game]) return null;
    var letters = c.name.replace(/[^A-Za-zÄÖÜäöüß]/g, '').length;
    var gen = [
      'Die Kategorie ist ' + cat.name,
      'Der Begriff hat ' + letters + ' Buchstaben',
      'Er beginnt mit dem Buchstaben ' + c.name.charAt(0).toUpperCase()
    ];
    return {
      key: c.game + '|' + c.cat + '|' + c.name, custom: true,
      game: c.game, cat: c.cat, catName: cat.name, color: cat.c, name: c.name,
      hints: c.hint ? [c.hint, gen[1], gen[2]] : gen,
      keys: [norm(c.name)]
    };
  }
  function applyEdits() {
    TERMS = BASE_TERMS.filter(function (t) { return ED.removed.indexOf(t.key) < 0; })
      .concat(ED.custom.map(customTerm).filter(Boolean));
  }
  function addCustom(name, hint) {
    name = String(name || '').trim().slice(0, 40);
    hint = String(hint || '').trim().slice(0, 120);
    if (!name) { S.edMsg = ['Bitte einen Begriff eingeben.', 'bad']; return; }
    var low = name.toLowerCase();
    if (TERMS.some(function (t) { return t.game === S.game && t.name.toLowerCase() === low; })) {
      S.edMsg = [name + ' gibt es in diesem Spiel schon.', 'bad']; return;
    }
    if (ED.custom.length >= 300) { S.edMsg = ['Mehr als 300 eigene Begriffe sind nicht möglich.', 'bad']; return; }
    ED.custom.push({ game: S.game, cat: S.edCat, name: name, hint: hint });
    saveEdits(); applyEdits();
    S.edMsg = [name + ' wurde hinzugefügt.', 'good'];
  }
  function renderEditor() {
    unlock();
    var G = GAMES[S.game];
    if (!G.cats.some(function (c) { return c.id === S.edCat; })) S.edCat = G.cats[0].id;
    var cat = CATMAP[S.edCat];
    var catChips = G.cats.map(function (c) {
      var cnt = TERMS.filter(function (t) { return t.cat === c.id; }).length;
      return '<button class="chip" style="--c:' + c.c + '" aria-pressed="' + (S.edCat === c.id) + '" data-act="edcat" data-v="' + c.id + '"><i></i>' + esc(c.name) + ' <small>' + cnt + '</small></button>';
    }).join('');
    var inCat = TERMS.filter(function (t) { return t.cat === S.edCat; });
    var list = inCat.map(function (t) {
      return '<li><span class="nm">' + esc(t.name) + (t.custom ? ' <small>eigener Begriff</small>' : '') + '</span>' +
        '<button class="tag no rm" data-act="delterm" data-v="' + esc(t.key) + '" aria-label="' + esc(t.name) + ' entfernen">Entfernen</button></li>';
    }).join('');
    var removedHere = ED.removed.filter(function (k) { return k.indexOf(S.game + '|') === 0; }).length;
    var msg = S.edMsg || ['', ''];
    S.edMsg = null;
    $app.innerHTML =
      '<header class="brand"><p class="eyebrow">' + esc(G.name) + '</p><h1 style="font-size:clamp(2rem,9vw,2.8rem)">Begriffe bearbeiten</h1></header>' +
      '<section class="panel"><h2>Kategorie</h2><div class="chips">' + catChips + '</div></section>' +
      '<section class="panel"><h2>Neuer Begriff in ' + esc(cat.name) + '</h2>' +
        '<form id="eform"><div class="stackf">' +
          '<label class="sr" for="ename">Begriff</label><input id="ename" type="text" maxlength="40" autocomplete="off" placeholder="Begriff eingeben">' +
          '<button class="btn-primary" type="submit">Hinzufügen</button></div></form>' +
        '<p class="msg ' + msg[1] + '" aria-live="polite">' + esc(msg[0]) + '</p>' +
      '<section class="panel"><h2>' + esc(cat.name) + ' (' + inCat.length + ')</h2>' +
        (list ? '<ul class="rows">' + list + '</ul>' : '<p class="hint">In dieser Kategorie ist gerade kein Begriff. Füge oben einen hinzu.</p>') + '</section>' +
      (removedHere ? '<button class="btn-ghost" data-act="restore">Entfernte Begriffe wiederherstellen (' + removedHere + ')</button>' : '') +
      '<button class="btn-primary" data-act="home">Fertig</button>' +
      '<p class="foot">Deine Änderungen werden nur auf diesem Gerät gespeichert. Freunde, die den Link öffnen, sehen sie nicht.</p>';
  }

  /* ---------- Freundesrunde ---------- */
  function loadPlayers() {
    try {
      var a = JSON.parse(localStorage.getItem('wbi-players') || '[]');
      return Array.isArray(a) ? a.filter(function (x) { return typeof x === 'string'; }).slice(0, 12) : [];
    } catch (e) { return []; }
  }
  function savePlayers() { try { localStorage.setItem('wbi-players', JSON.stringify(S.players)); } catch (e) { /* ohne Speicher weiter */ } }
  function loadCatTip() { try { return localStorage.getItem('wbi-cattip') !== '0'; } catch (e) { return true; } }
  function saveCatTip() { try { localStorage.setItem('wbi-cattip', S.showCat ? '1' : '0'); } catch (e) { /* ohne Speicher weiter */ } }
  function fcolor(t) { return S.showCat ? t.color : 'var(--line)'; }
  function addPlayer(name) {
    name = String(name || '').trim().slice(0, 16);
    if (!name || S.players.length >= 12) return;
    var low = name.toLowerCase();
    if (S.players.some(function (p) { return p.toLowerCase() === low; })) return;
    S.players.push(name);
    savePlayers();
  }
  function nextActive(from) {
    var n = S.players.length;
    for (var k = 1; k <= n; k++) {
      var i = (from + k) % n;
      if (!S.done[i]) return i;
    }
    return -1;
  }
  function freeTerm(f) {
    var cat = !f.tip && f.cat ? CATMAP[f.cat] : null;
    var label = f.tip || (cat ? cat.name : 'Eigener Begriff');
    var letters = f.name.replace(/[^A-Za-zÄÖÜäöüß]/g, '').length;
    return {
      key: 'free|' + f.name, custom: true, free: true,
      game: S.game, cat: cat ? f.cat : '', catName: label,
      color: cat ? cat.c : 'var(--r-pink)', name: f.name,
      hints: [
        f.tip || cat ? 'Die Kategorie ist ' + label : 'Ein selbst gewählter Begriff',
        'Der Begriff hat ' + letters + ' Buchstaben',
        'Er beginnt mit dem Buchstaben ' + f.name.charAt(0).toUpperCase()
      ],
      keys: [norm(f.name)]
    };
  }
  function validPick(name) {
    if (S.free[name]) return freeTerm(S.free[name]);
    var k = S.pick[name];
    if (!k) return null;
    return TERMS.filter(function (t) { return t.key === k && t.game === S.game; })[0] || null;
  }
  function pickFree(val, tip) {
    val = String(val || '').trim().slice(0, 40);
    tip = String(tip || '').trim().slice(0, 30);
    if (!val) { S.pkMsg = 'Bitte einen Begriff eingeben.'; return; }
    var low = norm(val);
    if (!low) { S.pkMsg = 'Der Begriff braucht mindestens einen Buchstaben oder eine Zahl.'; return; }
    var clash = S.players.some(function (n) {
      if (n === S.pkName) return false;
      var t = validPick(n);
      return t && norm(t.name) === low;
    });
    if (clash) { S.pkMsg = val + ' hat schon jemand anderes bekommen.'; return; }
    var existing = TERMS.filter(function (t) { return t.game === S.game && norm(t.name) === low; })[0];
    if (existing) {
      S.pick[S.pkName] = existing.key;
      delete S.free[S.pkName];
    } else {
      S.free[S.pkName] = { name: val, cat: S.pkCat, tip: tip };
      delete S.pick[S.pkName];
    }
    S.pkMsg = '';
  }
  function pkListHtml() {
    var q = norm(S.pkQ);
    var taken = {};
    S.players.forEach(function (n) {
      if (n === S.pkName) return;
      var t = validPick(n);
      if (t) taken[t.key] = true;
    });
    var items = TERMS.filter(function (t) {
      return t.game === S.game && (!S.pkCat || t.cat === S.pkCat) && (!q || norm(t.name).indexOf(q) > -1);
    });
    if (!items.length) return '<p class="hint">Kein passender Begriff gefunden.</p>';
    return '<ul class="rows">' + items.map(function (t) {
      var used = !!taken[t.key];
      return '<li><span class="nm">' + esc(t.name) + ' <small>' + esc(t.catName) + '</small></span>' +
        '<button class="tag pick rm" data-act="pkset" data-v="' + esc(t.key) + '"' + (used ? ' disabled' : '') + '>' + (used ? 'Vergeben' : 'Wählen') + '</button></li>';
    }).join('') + '</ul>';
  }
  function renderPicker() {
    var G = GAMES[S.game];
    var msg = S.pkMsg; S.pkMsg = '';
    var chips = '<button class="chip" aria-pressed="' + (S.pkCat === '') + '" data-act="pkcat" data-v="">Alle</button>' +
      G.cats.map(function (c) {
        return '<button class="chip" style="--c:' + c.c + '" aria-pressed="' + (S.pkCat === c.id) + '" data-act="pkcat" data-v="' + c.id + '"><i></i>' + esc(c.name) + '</button>';
      }).join('');
    var catName = S.pkCat ? CATMAP[S.pkCat].name : '';
    $app.innerHTML =
      '<header class="brand"><p class="eyebrow">Begriff zuteilen</p><h1 style="font-size:clamp(2rem,9vw,2.8rem)">Für ' + esc(S.pkName) + '</h1></header>' +
      '<section class="panel"><p class="hint"><b>Achtung:</b> ' + esc(S.pkName) + ' darf jetzt nicht auf den Bildschirm schauen.' +
        (validPick(S.pkName) ? ' Es ist schon ein Begriff festgelegt. Eine neue Wahl ersetzt ihn.' : '') + '</p></section>' +
      '<section class="panel"><h2>Eigenen Begriff eingeben</h2>' +
        '<form id="pkform"><div class="stackf"><label class="sr" for="pkfree">Begriff</label>' +
          '<input id="pkfree" type="text" maxlength="40" autocomplete="off" placeholder="Begriff eintippen">' +
          '<label class="sr" for="pktip">Kategorie-Tipp</label>' +
          '<input id="pktip" type="text" maxlength="30" autocomplete="off" placeholder="Kategorie-Tipp, z. B. Person, Ort, Waffe">' +
          '<button class="btn-primary" type="submit">Für ' + esc(S.pkName) + ' festlegen</button></div></form>' +
        '<p class="msg bad" aria-live="polite">' + esc(msg) + '</p>' +
        '<p class="hint">Der Kategorie-Tipp erscheint in der Runde, wenn der Tipp eingeblendet ist. ' + (catName ? 'Lässt du ihn leer, gilt die unten gewählte Kategorie ' + esc(catName) + '.' : 'Lässt du ihn leer und wählst unten "Alle", heißt er "Eigener Begriff".') + '</p></section>' +
      '<section class="panel"><h2>Oder aus der Liste wählen</h2><div class="chips">' + chips + '</div>' +
        '<div class="stackf"><label class="sr" for="pksearch">Suchen</label><input id="pksearch" type="text" autocomplete="off" placeholder="Begriff suchen" value="' + esc(S.pkQ) + '"></div></section>' +
      '<section class="panel" id="pklist">' + pkListHtml() + '</section>' +
      '<button class="btn-ghost" data-act="pkclear">Zufall beim Start nehmen</button>' +
      '<button class="btn-primary" data-act="home">Abbrechen</button>';
  }
  function startFriends() {
    var pl = S.players, taken = {};
    var chosen = pl.map(function (nm) {
      var t = validPick(nm);
      if (t && !taken[t.key]) { taken[t.key] = true; return t; }
      return null;
    });
    var rest = shuffle(pool().filter(function (t) { return !taken[t.key]; }));
    var need = chosen.filter(function (c) { return !c; }).length;
    if (pl.length < 2 || rest.length < need) return;
    S.assign = chosen.map(function (c) { return c || rest.pop(); });
    S.done = pl.map(function () { return false; });
    S.qs = pl.map(function () { return 0; });
    S.order = [];
    S.turn = 0;
    lock();
    friendsIntro();
  }
  function fcatLabel() { return 'Kategorie-Tipp ' + (S.showCat ? 'ausblenden' : 'einblenden'); }
  function friendsToggleCat() {
    S.showCat = !S.showCat;
    saveCatTip();
    if (S.fscreen === 'play') friendsPlay();
    else if (S.fscreen === 'intro') friendsIntro();
  }

  function friendsIntro() {
    var name = S.players[S.turn], t = S.assign[S.turn];
    S.fscreen = 'intro';
    var left = S.done.filter(function (d) { return !d; }).length;
    S.shown = true;
    $app.innerHTML =
      '<section class="play" style="--c:' + fcolor(t) + '">' +
        '<div class="bar"><span>Noch im Spiel: ' + left + ' von ' + S.players.length + '</span><button class="link" data-act="home">Abbrechen</button></div>' +
        '<div class="card"><p class="eyebrow">Als Nächstes</p><div class="term">' + esc(name) + '</div>' +
          (S.showCat ? '<span class="cat">Ich bin: ' + esc(t.catName) + '</span>' : '') +
          '<p class="hint">' + esc(name) + ', schau jetzt weg. Alle anderen dürfen auf den Bildschirm schauen.</p></div>' +
        '<button class="btn-primary" data-act="freveal">Begriff für die anderen aufdecken</button>' +
        '<button class="btn-ghost" data-act="cattoggle">' + fcatLabel() + '</button>' +
      '</section>';
  }
  function friendsPlay() {
    var name = S.players[S.turn], t = S.assign[S.turn];
    S.fscreen = 'play';
    $app.innerHTML =
      '<section class="play" style="--c:' + fcolor(t) + '">' +
        '<div class="bar"><span>' + esc(name) + ' fragt</span><span>Fragen <b id="fq">0</b></span></div>' +
        '<div class="card tap" id="fcard" data-act="fhide" role="button" tabindex="0" style="min-height:200px">' + (S.showCat ? '<span class="cat">' + esc(t.catName) + '</span>' : '') + '<div class="term" id="fterm"></div><p class="hint" id="fveil"></p></div>' +
        '<div class="pad"><button class="no" data-act="fno">Nein<small>Nächster ist dran</small></button><button class="ok" data-act="fyes">Ja<small>Nochmal fragen</small></button></div>' +
        '<button class="btn-primary" data-act="fok">' + esc(name) + ' hat es erraten</button>' +
        '<div class="pad"><button class="skip" data-act="fhide" id="fhidebtn">Begriff verdecken</button><button class="skip" data-act="fgive">Aufgeben</button></div>' +
        '<button class="btn-ghost" data-act="cattoggle">' + fcatLabel() + '</button>' +
        '<p class="foot">Falsch geraten zählt wie ein Nein.</p>' +
      '</section>';
    fupdate();
  }
  function fupdate() {
    var t = S.assign[S.turn];
    document.getElementById('fq').textContent = S.qs[S.turn];
    document.getElementById('fterm').textContent = S.shown ? t.name : '• • • • •';
    document.getElementById('fhidebtn').textContent = S.shown ? 'Begriff verdecken' : 'Begriff aufdecken';
    document.getElementById('fveil').textContent = S.shown
      ? 'Tippen zum Verdecken, damit ' + S.players[S.turn] + ' aufs Handy schauen kann'
      : 'Verdeckt. Tippen zum Aufdecken';
    var fc = document.getElementById('fcard');
    if (fc) { fc.classList.toggle('veiled', !S.shown); fc.setAttribute('aria-pressed', String(!S.shown)); }
  }
  function friendsYes() {
    S.qs[S.turn]++;
    fupdate();
    var c = document.getElementById('fcard');
    if (c) { c.classList.remove('pop-ok'); void c.offsetWidth; c.classList.add('pop-ok'); }
  }
  function friendsNo() {
    S.qs[S.turn]++;
    S.turn = nextActive(S.turn);
    friendsIntro();
  }
  function friendsFinish(ok) {
    S.fscreen = 'fin';
    var idx = S.turn, t = S.assign[idx], name = S.players[idx];
    S.done[idx] = true;
    var place = S.order.filter(function (e) { return e.ok; }).length + 1;
    var pts = ok ? Math.max(1, S.players.length - place + 1) : 0;
    S.order.push({ idx: idx, ok: ok, pts: pts, q: S.qs[idx] });
    var left = S.done.filter(function (d) { return !d; }).length;
    var detail = ok
      ? 'Platz ' + place + ' nach ' + S.qs[idx] + (S.qs[idx] === 1 ? ' Frage.' : ' Fragen.')
      : 'Aufgegeben nach ' + S.qs[idx] + (S.qs[idx] === 1 ? ' Frage.' : ' Fragen.');
    $app.innerHTML =
      '<section class="play" style="--c:' + t.color + '">' +
        '<div class="card"><p class="eyebrow">' + esc(name) + ' war</p><span class="cat">' + esc(t.catName) + '</span>' +
          '<div class="term">' + esc(t.name) + '</div><p class="score-big">' + (ok ? '+' + pts : '0') + '</p><p class="hint">' + detail + '</p></div>' +
        '<button class="btn-primary" data-act="fnext">' + (left ? 'Weiter' : 'Zur Auswertung') + '</button>' +
      '</section>';
  }
  function friendsEnd() {
    unlock();
    var r = S.order.slice().sort(function (a, b) { return b.pts - a.pts; });
    var top = r.length ? r[0].pts : 0;

        '<span class="score-of">' + (win ? 'hat seinen Begriff als Erster erraten' : 'Diesmal hat niemand seinen Begriff erraten.') + '</span></header>' +
        '<section class="panel"><h2>Rangliste</h2><ul class="rows">' + rows + '</ul></section>' +
        '<button class="btn-primary" data-act="again">Neue Runde mit neuen Begriffen</button>' +

  /* ---------- Online ---------- */
  /* Aufbau: Eine Person (Host) hält den Spielstand `g` in ihrer Präsenz. Alle anderen lesen ihn und
     melden ihre Eingaben (Begriff, Frage, Antwort) in ihrer eigenen Präsenz. Der Host wertet aus
     (olStep) und schreibt den neuen Stand. Fällt der Host weg, übernimmt der Spieler mit der kleinsten ID. */
  var SHARE_URL = (function () { try { return String(window.location.href).split('#')[0]; } catch (e) { return ''; } })();
  var OLMAX = 10;
  var TAKEOVER_MS = 3500, JOIN_MS = 4500;
  var AVC = ['var(--r-rare)', 'var(--r-uncommon)', 'var(--r-epic)', 'var(--r-legendary)', 'var(--r-gold)', 'var(--r-pink)', 'var(--r-common)'];
  var lastHtml = '';
  var OL = {
    api: null, room: null, code: '', id: '', name: '', host: false, g: null, lastG: null,
    joined: false, joining: false, err: '', conn: true, copy: '', pkCat: '', pkQ: '', pkMsg: '',
    nameInput: '', codeInput: '', unsubs: [], tk: null, jn: null
  };

  function rid(n, al) {
    al = al || 'abcdefghijklmnopqrstuvwxyz0123456789';
    var s = '';
    for (var i = 0; i < n; i++) s += al.charAt(Math.floor(Math.random() * al.length));
    return s;
  }
  function olId() {
    try { var v = localStorage.getItem('wbi-olid'); if (v && /^[a-z0-9]{8}$/.test(v)) return v; } catch (e) { /* weiter */ }
    var id = rid(8);
    try { localStorage.setItem('wbi-olid', id); } catch (e) { /* weiter */ }
    return id;
  }
  function olLoadName() { try { return (localStorage.getItem('wbi-olname') || '').slice(0, 16); } catch (e) { return ''; } }
  function olSaveName(n) { try { localStorage.setItem('wbi-olname', n); } catch (e) { /* weiter */ } }
  function olSaved() {
    try {
      var o = JSON.parse(localStorage.getItem('wbi-ol') || 'null');
      if (o && /^[A-Z0-9]{4,8}$/.test(o.code) && Date.now() - o.t < 6 * 3600 * 1000) return o;
    } catch (e) { /* weiter */ }
    return null;
  }
  function olSave() { try { localStorage.setItem('wbi-ol', JSON.stringify({ code: OL.code, t: Date.now() })); } catch (e) { /* weiter */ } }
  function olForget() { try { localStorage.removeItem('wbi-ol'); } catch (e) { /* weiter */ } }
  function cleanName(s) { return String(s || '').replace(/\s+/g, ' ').trim().slice(0, 16); }
  function cleanCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); }
  function byId(a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* --- Spiellogik (rein, ohne Oberfläche) --- */
  function olNextActive(g, from) {
    var N = g.pl.length;
    for (var k = 1; k <= N; k++) {
      var i = (from + k) % N;
      if (!g.dn[i]) return i;
    }
    return -1;
  }
  function olFinish(g, a, ok, x) {
    var N = g.pl.length;
    g.dn[a] = 1;
    var place = g.od.filter(function (e) { return e[1]; }).length + 1;
    var pts = ok ? Math.max(1, N - place + 1) : 0;
    g.od.push([a, ok ? 1 : 0, g.qs[a], pts]);
    g.lq = { w: a, x: '', k: ok ? 'g' : 'u', a: ok ? 'ok' : 'u', p: pts };
    var nx = olNextActive(g, a);
    if (nx < 0) { g.ph = 'end'; g.oq = null; g.vt = null; } else { g.tu = nx; }
    g.r++;
  }
  function olStep(g0, pres) {
    var g = clone(g0);
    var by = {};
    pres.forEach(function (q) { by[q.id] = q; });
    var N = g.pl ? g.pl.length : 0, i;
    if (g.ph === 'terms') {
      for (i = 0; i < N; i++) {
        var p = by[g.pl[i]], t = p && p.t, ti = g.tg[i];
        if (t && typeof t.n === 'string' && t.n.trim() && t.f === g.pl[ti]) {
          g.tn[ti] = t.n.trim().slice(0, 40);
          g.tk[ti] = String(t.k || '').trim().slice(0, 30);
          g.tc[ti] = CATMAP[t.cc] ? t.cc : '';
        }
      }
      var all = N >= 2;
      for (i = 0; i < N; i++) if (!g.tn[i]) all = false;
      if (all) {
        g.ph = 'play'; g.tu = 0; g.r = 1;
        g.dn = []; g.qs = [];
        for (i = 0; i < N; i++) { g.dn.push(0); g.qs.push(0); }
        g.od = []; g.lq = null; g.oq = null; g.vt = null;
      }
    }
    if (g.ph === 'play') {
      var a = g.tu, ap = by[g.pl[a]], q = ap && ap.q;
      g.oq = null; g.vt = null;
      if (q && q.r === g.r && q.k === 'u') {
        olFinish(g, a, false, '');
      } else if (q && q.r === g.r && (q.k === 'q' || q.k === 'g') && typeof q.x === 'string' && q.x.trim()) {
        var x = q.x.trim().slice(0, 100);
        var y = 0, n = 0, tot = 0;
        g.pl.forEach(function (id, ix) {
          if (ix === a) return;
          var v = by[id];
          if (!v) return;
          tot++;
          if (v.v && v.v.r === g.r) { if (v.v.a === 'j') y++; else if (v.v.a === 'n') n++; }
        });
        g.oq = { x: x, k: q.k };
        g.vt = [y, n, tot];
        var res = '';
        if (tot > 0 && y * 2 > tot) res = 'j';
        else if (tot > 0 && n * 2 >= tot) res = 'n';
        if (res) {
          g.qs[a]++;
          g.oq = null; g.vt = null;
          if (q.k === 'g' && res === 'j') {
            olFinish(g, a, true, x);
            g.lq.x = x;
          } else {
            g.lq = { w: a, x: x, k: q.k, a: res };
            if (res === 'n') g.tu = olNextActive(g, a);
            g.r++;
          }
        }
      }
    }
    return g;
  }

  /* --- Verbindung --- */
  function olRoomApi() {
    if (OL.api) return Promise.resolve(OL.api);
    try {
      if (!window.claude || !window.claude.use) return Promise.resolve(null);
      return window.claude.use('room').then(function (r) { OL.api = r || null; return OL.api; }, function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }
  function olReset() {
    OL.unsubs.forEach(function (u) { try { u(); } catch (e) { /* egal */ } });
    OL.unsubs = [];
    if (OL.tk) clearTimeout(OL.tk);
    if (OL.jn) clearTimeout(OL.jn);
    OL.tk = null; OL.jn = null;
    var r = OL.room;
    OL.room = null; OL.host = false; OL.g = null; OL.lastG = null;
    OL.joined = false; OL.joining = false; OL.conn = true; OL.copy = '';
    OL.pkCat = ''; OL.pkQ = ''; OL.pkMsg = ''; OL.code = '';
    lastHtml = '';
    if (r) { try { r.leave().catch(function () {}); } catch (e) { /* egal */ } }
  }
  function olFail(msg) {
    olReset();
    OL.err = msg;
    olRender();
  }
  function olEnter(code, asHost) {
    var name = cleanName(OL.nameInput);
    if (!name) { OL.err = 'Bitte gib zuerst deinen Namen ein.'; olRender(); return; }
    if (!asHost && code.length < 4) { OL.err = 'Der Raumcode hat mindestens 4 Zeichen.'; olRender(); return; }
    olSaveName(name);
    OL.err = ''; OL.name = name; OL.code = code; OL.joining = true; OL.joined = false;
    OL.id = olId();
    olRender();
    olRoomApi().then(function (api) {
      if (!api) {
        olFail('Online spielen geht gerade nicht. Prüfe deine Internetverbindung und lade die Seite neu.');
        return;
      }
      return api.join('wbi-' + code.toLowerCase(), { create: !!asHost }).then(function (room) {
        OL.room = room;
        var pres = { o: 1, id: OL.id, n: name, c: code, j: Date.now() };
        if (asHost) {
          OL.host = true;
          OL.g = { v: 1, ph: 'lobby', gm: S.game, tip: S.showCat ? 1 : 0 };
          pres.h = 1; pres.g = OL.g;
        } else {
          OL.jn = setTimeout(function () {
            if (!OL.joined) olFail('Den Raum ' + code + ' gibt es gerade nicht. Prüfe den Code oder frage, ob die Runde noch offen ist.');
          }, JOIN_MS);
        }
        room.presence(pres).catch(function () {});
        OL.unsubs.push(room.onPeers(olSync, function () { olFail('Die Verbindung zum Raum ist abgebrochen.'); }));
        OL.unsubs.push(room.onConnection(function (c) { OL.conn = !!c; olRender(); }));
        if (asHost) { OL.joined = true; OL.joining = false; olSave(); }
        olSync();
      }, function (e) {
        var c = e && e.code;
        olFail(c === 'not_permitted'
          ? 'Du kannst diesem Raum nicht beitreten.'
          : 'Der Raum ist gerade nicht erreichbar. Versuche es gleich noch einmal.');
      });
    });
  }
  function olRecords() {
    if (!OL.room) return [];
    var best = {};
    OL.room.peers().forEach(function (p) {
      var q = p.presence;
      if (p.kind !== 'viewer' || !q || q.o !== 1 || q.c !== OL.code || typeof q.id !== 'string') return;
      var b = best[q.id];
      if (!b || p.sameTab || (!b.sameTab && p.updatedAt > b.updatedAt)) best[q.id] = p;
    });
    return Object.keys(best).map(function (k) { return best[k].presence; });
  }
  function olFixName(pres) {
    var low = OL.name.toLowerCase();
    var clash = pres.some(function (q) { return q.id !== OL.id && String(q.n).toLowerCase() === low; });
    if (!clash) return;
    var k = 2, nm;
    do { nm = OL.name.slice(0, 13) + ' ' + k; k++; }
    while (pres.some(function (q) { return String(q.n).toLowerCase() === nm.toLowerCase(); }));
    OL.name = nm;
    OL.room.presence({ n: nm }).catch(function () {});
  }
  function olSync() {
    if (!OL.room) return;
    var pres = olRecords();
    var hosts = pres.filter(function (q) { return q.h === 1 && q.g && typeof q.g === 'object'; }).sort(byId);
    var eff = hosts[0];
    if (eff) {
      if (OL.tk) { clearTimeout(OL.tk); OL.tk = null; }
      if (eff.id === OL.id) {
        OL.host = true;
      } else {
        if (OL.host) { OL.host = false; OL.room.presence({ h: null, g: null }).catch(function () {}); }
        OL.g = eff.g; OL.lastG = eff.g;
      }
      if (!OL.joined) {
        OL.joined = true; OL.joining = false;
        if (OL.jn) { clearTimeout(OL.jn); OL.jn = null; }
        olSave(); olFixName(pres);
      }
    } else if (OL.joined && !OL.tk) {
      OL.tk = setTimeout(olTakeover, TAKEOVER_MS);
    }
    if (OL.host && OL.g) {
      var ng = olStep(OL.g, pres);
      if (JSON.stringify(ng) !== JSON.stringify(OL.g)) { OL.g = ng; OL.room.presence({ g: ng }).catch(function () {}); }
    }
    olClearStale();
    olRender();
  }
  /* Eigene Eingaben aufräumen, wenn die Phase gewechselt hat */
  function olClearStale() {
    var g = OL.g;
    if (!g || !OL.room) return;
    var mine = null;
    olRecords().forEach(function (q) { if (q.id === OL.id) mine = q; });
    if (!mine) return;
    var patch = null;
    if (g.ph !== 'terms' && mine.t) { patch = patch || {}; patch.t = null; }
    if (g.ph !== 'play' && (mine.q || mine.v)) { patch = patch || {}; patch.q = null; patch.v = null; }
    if (patch) OL.room.presence(patch).catch(function () {});
  }
  function olTakeover() {
    OL.tk = null;
    if (!OL.room || !OL.joined) return;
    var pres = olRecords();
    if (pres.some(function (q) { return q.h === 1 && q.g; })) return;
    var cand = pres.slice().sort(byId);
    if (!OL.lastG || !cand.length || cand[0].id !== OL.id) { OL.tk = setTimeout(olTakeover, TAKEOVER_MS + 2000); return; }
    OL.host = true;
    OL.g = clone(OL.lastG);
    OL.room.presence({ h: 1, g: OL.g }).catch(function () {});
    olSync();
  }
  function olLeave() {
    olForget();
    olReset();
    renderEntry();
  }
  function olHostSet(fn) {
    if (!OL.host || !OL.g) return;
    var g = clone(OL.g);
    fn(g);
    g = olStep(g, olRecords());
    OL.g = g;
    OL.room.presence({ g: g }).catch(function () {});
    olRender();
  }
  function olSend(patch) {
    if (!OL.room) return;
    OL.room.presence(patch).catch(function () {});
  }

  /* --- Begriffe --- */
  function olLabel(g, j) {
    return g.tk[j] || (CATMAP[g.tc[j]] ? CATMAP[g.tc[j]].name : 'Eigener Begriff');
  }
  function olColor(g, j) { return CATMAP[g.tc[j]] ? CATMAP[g.tc[j]].c : 'var(--r-pink)'; }
  function olPool(g) { return TERMS.filter(function (t) { return t.game === g.gm; }); }
  function olTaken(g, pres, me) {
    var ti = g.tg[me], taken = {};
    g.tn.forEach(function (nm, j) { if (nm && j !== ti) taken[norm(nm)] = true; });
    pres.forEach(function (q) { if (q.t && q.t.n && q.id !== OL.id && q.t.f !== g.pl[ti]) taken[norm(q.t.n)] = true; });
    return taken;
  }
  function olMyT(g, pres, me) {
    var t = null;
    pres.forEach(function (q) { if (q.id === OL.id) t = q.t; });
    return t && t.f === g.pl[g.tg[me]] && t.n ? t : null;
  }
  function olChoose(name, tip, cc) {
    var g = OL.g;
    if (!g || g.ph !== 'terms') return;
    var me = g.pl.indexOf(OL.id);
    if (me < 0) return;
    name = String(name || '').trim().slice(0, 40);
    tip = String(tip || '').trim().slice(0, 30);
    if (!name || !norm(name)) { OL.pkMsg = 'Bitte einen Begriff eingeben.'; return; }
    var pres = olRecords();
    if (olTaken(g, pres, me)[norm(name)]) { OL.pkMsg = name + ' hat schon jemand anderes bekommen.'; return; }
    var ex = olPool(g).filter(function (t) { return norm(t.name) === norm(name); })[0];
    if (ex && !tip) { name = ex.name; cc = ex.cat; }
    OL.pkMsg = '';
    olSend({ t: { f: g.pl[g.tg[me]], n: name, k: tip, cc: cc || '' } });
  }
  function olRandomTerm() {
    var g = OL.g, me = g.pl.indexOf(OL.id);
    if (me < 0) return;
    var taken = olTaken(g, olRecords(), me);
    var free = shuffle(olPool(g).filter(function (t) { return !taken[norm(t.name)]; }));
    if (!free.length) { OL.pkMsg = 'Es sind keine freien Begriffe mehr da.'; return; }
    olChoose(free[0].name, '', free[0].cat);
  }
  function olFillMissing() {
    olHostSet(function (g) {
      var used = {};
      g.tn.forEach(function (nm) { if (nm) used[norm(nm)] = true; });
      var free = shuffle(olPool(g).filter(function (t) { return !used[norm(t.name)]; }));
      for (var j = 0; j < g.pl.length; j++) {
        if (!g.tn[j] && free.length) { var t = free.pop(); g.tn[j] = t.name; g.tk[j] = ''; g.tc[j] = t.cat; }
      }
    });
  }
  function olPkListHtml(g, pres, me) {
    var q = norm(OL.pkQ), taken = olTaken(g, pres, me);
    var mine = olMyT(g, pres, me);
    var items = olPool(g).filter(function (t) { return (!OL.pkCat || t.cat === OL.pkCat) && (!q || norm(t.name).indexOf(q) > -1); });
    if (!items.length) return '<p class="hint">Kein passender Begriff gefunden.</p>';
    var more = items.length > 80;
    return '<ul class="rows">' + items.slice(0, 80).map(function (t) {
      var used = !!taken[norm(t.name)], sel = mine && norm(mine.n) === norm(t.name);
      return '<li><span class="nm">' + esc(t.name) + ' <small>' + esc(t.catName) + '</small></span>' +
        '<button class="tag pick rm" data-act="ol-pick" data-v="' + esc(t.key) + '"' + (used ? ' disabled' : '') + '>' + (sel ? 'Gewählt' : used ? 'Vergeben' : 'Wählen') + '</button></li>';
    }).join('') + '</ul>' + (more ? '<p class="hint">Es gibt mehr Treffer. Nutze die Suche oder eine Kategorie.</p>' : '');
  }

  /* --- Oberfläche --- */
  function setHtml(html) {

    var els = $app.querySelectorAll ? $app.querySelectorAll('input') : [];
    Array.prototype.forEach.call(els, function (el) { if (el.id && el.type !== 'hidden') keep[el.id] = el.value; });
    if (act && typeof act.selectionStart === 'number') sel = [act.selectionStart, act.selectionEnd];
    $app.innerHTML = html;
    Object.keys(keep).forEach(function (id) {

  function topbar() {

  function seatColor(i) { return AVC[i % AVC.length]; }

  function olLobbyHtml(g, pres) {
    var list = pres.slice().sort(function (a, b) { return (a.j - b.j) || byId(a, b); });
    var seats = '<div class="seats">' + list.map(function (q, i) {

  /* ---------- Verbindung Handy zu Handy (PeerJS) ----------
     Der Ersteller des Raums ist die Vermittlungsstelle: alle anderen verbinden sich mit ihm,
     er verteilt den Stand aller Mitspieler. Die Schnittstelle gleicht der Raum-Funktion von Claude. */
  function createPeerRoom(Peer, st) {
    var CONNECT_MS = 9000;
    return {
      join: function (name, opts) {
        var create = !!(opts && opts.create);
        return new Promise(function (resolve, reject) {
          var done = false;
          var members = {}, conns = {}, snap = [], myId = '', mine = {}, left = false, pend = false, notifyPend = false;
          var peersCbs = [], connCbs = [], errCbs = [], hubConn = null, connected = false, peer, timer = null;
          function fail(code) {
            if (!done) { done = true; if (timer) clearTimeout(timer); try { peer.destroy(); } catch (e) { /* egal */ } reject({ code: code }); }
          }
          function notify() {
            if (notifyPend || left) return;
            notifyPend = true;
            st(function () { notifyPend = false; if (!left) peersCbs.slice().forEach(function (cb) { try { cb({}); } catch (e) { /* egal */ } }); }, 0);
          }
          function setConn(c) { if (connected !== c) { connected = c; connCbs.slice().forEach(function (cb) { try { cb(c); } catch (e) { /* egal */ } }); } }
          function runErr(code) {
            var l = errCbs.slice(); errCbs = [];
            l.forEach(function (cb) { try { cb({ code: code, message: code }); } catch (e) { /* egal */ } });
          }
          function merge(base, patch) {
            var o = {};
            Object.keys(base).forEach(function (k) { o[k] = base[k]; });
            Object.keys(patch).forEach(function (k) { if (patch[k] === null) delete o[k]; else o[k] = JSON.parse(JSON.stringify(patch[k])); });
            return o;
          }
          function broadcast() {
            if (pend) return;
            pend = true;
            st(function () {
              pend = false;
              if (left) return;
              snap = Object.keys(members).map(function (id) { return { peer: id, presence: members[id].presence, updatedAt: members[id].updatedAt }; });
              var msg = { t: 'snap', peers: snap };
              Object.keys(conns).forEach(function (id) { try { conns[id].send(msg); } catch (e) { /* egal */ } });
              notify();
            }, 20);
          }
          var api = {
            presence: function (patch) {
              var np = merge(mine, patch);
              if (JSON.stringify(np).length > 4000) return Promise.reject({ code: 'invalid_argument' });
              mine = np;
              if (create) {
                members[myId] = { presence: mine, updatedAt: Date.now() };
                broadcast();
              } else {
                if (hubConn && hubConn.open) { try { hubConn.send({ t: 'pres', patch: patch }); } catch (e) { /* egal */ } }
                notify();
              }
              return Promise.resolve();
            },
            peers: function () {
              var list = create ? snap : snap.slice();
              var seen = false;
              var out = list.map(function (p) {
                var me = p.peer === myId;
                if (me) seen = true;
                return { peer: p.peer, by: null, isMe: me, sameTab: me, kind: 'viewer', guest: false, presence: me ? mine : p.presence, updatedAt: p.updatedAt };
              });
              if (!seen && myId) out.push({ peer: myId, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: mine, updatedAt: Date.now() });
              return out;
            },
            onPeers: function (cb, errCb) {
              peersCbs.push(cb);
              if (errCb) errCbs.push(errCb);
              st(function () { if (!left) cb({}); }, 0);
              return function () { peersCbs = peersCbs.filter(function (x) { return x !== cb; }); };
            },
            onConnection: function (cb) {
              connCbs.push(cb);
              return function () { connCbs = connCbs.filter(function (x) { return x !== cb; }); };
            },
            connected: function () { return connected; },
            leave: function () {
              left = true;
              try { peer.destroy(); } catch (e) { /* egal */ }
              return Promise.resolve();
            }
          };
          try { peer = create ? new Peer(name) : new Peer(); } catch (e) { fail('upstream_error'); return; }
          timer = setTimeout(function () { fail('upstream_error'); }, CONNECT_MS);
          if (create) {
            peer.on('open', function (id) {
              myId = id; members[id] = { presence: {}, updatedAt: Date.now() };
              done = true; clearTimeout(timer); setConn(true);
              snap = [{ peer: id, presence: {}, updatedAt: Date.now() }];
              resolve(api);
            });
            peer.on('connection', function (conn) {
              conn.on('open', function () {
                conns[conn.peer] = conn;
                members[conn.peer] = { presence: {}, updatedAt: Date.now() };
                broadcast();
              });
              conn.on('data', function (m) {
                if (!m || m.t !== 'pres' || !m.patch || typeof m.patch !== 'object' || !members[conn.peer]) return;
                var np = merge(members[conn.peer].presence, m.patch);
                if (JSON.stringify(np).length > 4000) return;
                members[conn.peer] = { presence: np, updatedAt: Date.now() };
                broadcast();
              });
              function gone() { if (conns[conn.peer]) { delete conns[conn.peer]; delete members[conn.peer]; broadcast(); } }
              conn.on('close', gone); conn.on('error', gone);
            });
            peer.on('error', function (e) {
              if (!done) fail('upstream_error'); else runErr('upstream_error');
            });
            peer.on('disconnected', function () { setConn(false); try { peer.reconnect(); } catch (e) { /* egal */ } });
          } else {
            peer.on('open', function (id) {
              myId = id;
              var conn = peer.connect(name, { reliable: true });
              conn.on('open', function () {
                hubConn = conn; done = true; clearTimeout(timer); setConn(true);
                resolve(api);
              });
              conn.on('data', function (m) {
                if (m && m.t === 'snap' && Array.isArray(m.peers)) { snap = m.peers; notify(); }
              });
              function lost() { hubConn = null; setConn(false); if (!done) fail('upstream_error'); else runErr('upstream_error'); }
              conn.on('close', lost); conn.on('error', lost);
            });
            peer.on('error', function (e) {
              if (!done) fail('upstream_error'); else runErr('upstream_error');
            });
          }
        });
      }
    };
  }

  var PEERROOM = null;
  window.claude = { use: function (n) {
    if (n !== 'room' || !window.Peer) return Promise.resolve(null);
    if (!PEERROOM) PEERROOM = createPeerRoom(window.Peer, function (f, ms) { return setTimeout(f, ms || 0); });
    return Promise.resolve({ join: function (name, o) { return PEERROOM.join(name, o); } });
  } };

  /* ---------- Ereignisse ---------- */
  var CODE_AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function readVal(id) { var el = document.getElementById(id); return el ? String(el.value || '') : ''; }
  function readName() { var v = readVal('olname'); if (v || document.getElementById('olname')) OL.nameInput = v; }
  $app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');

    var v = b.dataset.v;

      case 'go-local': renderHome(); window.scrollTo(0, 0); break;

        if (OL.room || OL.joining) olReset();
        renderEntry(); break;
      case 'cat':
        if (S.cats.has(v)) S.cats.delete(v); else S.cats.add(v);
        renderHome(); break;
      case 'allcats':
        S.cats = new Set(GAMES[S.game].cats.map(function (c) { return c.id; }));
        renderHome(); break;
      case 'game':
        if (S.game !== v) {
          S.game = v;
          S.cats = new Set(GAMES[v].cats.map(function (c) { return c.id; }));
        }
        renderHome(); break;
      case 'again':
        S.pick = {}; S.free = {};
        startFriends();
        break;
      case 'start': startFriends(); break;
      case 'home': renderHome(); break;
      case 'rmplayer':
        delete S.pick[S.players[+v]]; delete S.free[S.players[+v]];
        S.players.splice(+v, 1); savePlayers(); renderHome(); break;
      case 'pickfor':
        S.pkName = S.players[+v]; S.pkCat = ''; S.pkQ = ''; S.pkMsg = '';
        renderPicker(); window.scrollTo(0, 0); break;
      case 'pkcat': S.pkCat = v; renderPicker(); break;
      case 'pkset': if (v) { S.pick[S.pkName] = v; delete S.free[S.pkName]; } renderHome(); break;
      case 'pkclear': delete S.pick[S.pkName]; delete S.free[S.pkName]; renderHome(); break;
      case 'cattoggle': friendsToggleCat(); break;
      case 'edit': renderEditor(); window.scrollTo(0, 0); break;
      case 'edcat': S.edCat = v; renderEditor(); break;
      case 'delterm':
        var gone = TERMS.filter(function (t) { return t.key === v; })[0];
        if (gone) {
          if (gone.custom) {
            ED.custom = ED.custom.filter(function (c) { return (c.game + '|' + c.cat + '|' + c.name) !== v; });
          } else if (ED.removed.indexOf(v) < 0) {
            ED.removed.push(v);
          }
          saveEdits(); applyEdits();
          S.edMsg = [gone.name + ' wurde entfernt.', ''];
        }
        renderEditor(); break;
      case 'restore':
        ED.removed = ED.removed.filter(function (k) { return k.indexOf(S.game + '|') !== 0; });
        saveEdits(); applyEdits();
        S.edMsg = ['Die entfernten Begriffe sind wieder da.', 'good'];
        renderEditor(); break;
      case 'cattip': S.showCat = v === '1'; saveCatTip(); renderHome(); break;
      case 'freveal': friendsPlay(); break;
      case 'fhide': S.shown = !S.shown; fupdate(); break;
      case 'fyes': friendsYes(); break;
      case 'fno': friendsNo(); break;
      case 'fok': friendsFinish(true); break;
      case 'fgive': friendsFinish(false); break;
      case 'fnext':
        var nx = nextActive(S.turn);
        if (nx < 0) { friendsEnd(); } else { S.turn = nx; friendsIntro(); }
        break;

      /* Online */
      case 'ol-namepick':
        OL.nameInput = v;
        var ni = document.getElementById('olname');
        if (ni) ni.value = v;
        break;
      case 'ol-create': readName(); olEnter(rid(5, CODE_AL), true); break;
      case 'ol-rejoin': readName(); olEnter(cleanCode(v), false); break;
      case 'ol-leave': olLeave(); break;
      case 'ol-copy-code': olCopy(OL.code, 'Code'); break;
      case 'ol-copy-link': olCopy(SHARE_URL + '#join-' + OL.code, 'Link'); break;
      case 'ol-game': olHostSet(function (x) { if (GAMES[v]) x.gm = v; }); break;
      case 'ol-tip':
        S.showCat = v === '1'; saveCatTip();
        olHostSet(function (x) { x.tip = v === '1' ? 1 : 0; }); break;
      case 'ol-start': olStart(); break;
      case 'ol-pick':
        if (g) {
          var tm = TERMS.filter(function (t) { return t.key === v && t.game === g.gm; })[0];
          if (tm) olChoose(tm.name, '', tm.cat);
        }
        olRender(); break;
      case 'ol-pkcat': OL.pkCat = v; olRender(); break;
      case 'ol-random': olRandomTerm(); olRender(); break;
      case 'ol-fill': olFillMissing(); break;
      case 'ol-lobby': olHostSet(function (x) { x.ph = 'lobby'; }); break;
      case 'ol-vote': if (g && g.ph === 'play') olSend({ v: { r: g.r, a: v === 'j' ? 'j' : 'n' } }); break;
      case 'ol-guess':
      case 'ol-ask':
        var tx = readVal('olqtext').trim().slice(0, 100);
        if (g && g.ph === 'play' && tx) olSend({ q: { r: g.r, k: b.dataset.act === 'ol-guess' ? 'g' : 'q', x: tx } });
        break;
      case 'ol-giveup': if (g && g.ph === 'play') olSend({ q: { r: g.r, k: 'u' } }); break;
      case 'ol-skip':
        olHostSet(function (x) {
          if (x.ph !== 'play') return;
          var n2 = olNextActive(x, x.tu);
          if (n2 >= 0) x.tu = n2;
          x.r++;
        }); break;
      case 'ol-endround':
        olHostSet(function (x) {
          if (x.ph !== 'play') return;
          for (var i = 0; i < x.pl.length; i++) if (!x.dn[i]) { x.dn[i] = 1; x.od.push([i, 0, x.qs[i], 0]); }
          x.ph = 'end'; x.oq = null; x.vt = null; x.r++;
        }); break;
      case 'ol-again': olHostSet(function (x) { x.ph = 'lobby'; x.oq = null; x.vt = null; x.lq = null; }); break;
    }
  });
  $app.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === 'pkform') {
      pickFree(document.getElementById('pkfree').value, document.getElementById('pktip').value);
      if (S.pkMsg) { renderPicker(); } else { renderHome(); }
    }
    if (id === 'eform') {
      addCustom(document.getElementById('ename').value, '');
      renderEditor();
      var en = document.getElementById('ename');
      if (en) en.focus();
    }
    if (id === 'pform') {
      addPlayer(document.getElementById('pname').value);
      renderHome();
      var pn = document.getElementById('pname');
      if (pn) pn.focus();
    }
    if (id === 'olcodeform') {
      readName();
      OL.codeInput = cleanCode(readVal('olcode'));
      olEnter(OL.codeInput, false);
    }
    if (id === 'olterm') {
      olChoose(readVal('olfree'), readVal('oltip'), '');
      if (!OL.pkMsg) { var f1 = document.getElementById('olfree'), f2 = document.getElementById('oltip'); if (f1) f1.value = ''; if (f2) f2.value = ''; }
      olRender();
    }
    if (id === 'olq') {
      var g = OL.g, tx = readVal('olqtext').trim().slice(0, 100);
      if (g && g.ph === 'play' && tx) olSend({ q: { r: g.r, k: 'q', x: tx } });
    }
  });

  $app.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'pksearch') {
      S.pkQ = e.target.value;
      var box = document.getElementById('pklist');
      if (box) box.innerHTML = pkListHtml();
    } else if (id === 'olsearch') {
      OL.pkQ = e.target.value;
      var g = OL.g, box2 = document.getElementById('olpklist');
      if (box2 && g && g.ph === 'terms') {
        var me = g.pl.indexOf(OL.id);
        if (me >= 0) box2.innerHTML = olPkListHtml(g, olRecords(), me);
      }
    } else if (id === 'olname') {
      OL.nameInput = e.target.value;
    } else if (id === 'olcode') {
      OL.codeInput = cleanCode(e.target.value);
    }
  });
  $app.addEventListener('keydown', function (e) {
    var el = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && el && el.getAttribute && el.getAttribute('role') === 'button') {
      e.preventDefault();
      el.click();
    }
  });

  function joinFromHash() {
    var m = /^#join-([a-z0-9]{4,8})$/i.exec(String((window.location && window.location.hash) || ''));
    if (!m || OL.room || OL.joining) return false;
    OL.codeInput = cleanCode(m[1]);
    OL.nameInput = OL.nameInput || olLoadName();
    S.where = 'online'; lastHtml = '';
    olRender();
    return true;
  }
  try { window.addEventListener('hashchange', joinFromHash); } catch (e) { /* egal */ }

  ED = loadEdits();
  applyEdits();
  if (!joinFromHash()) renderEntry();
})();
</script>
</body>
</html>
